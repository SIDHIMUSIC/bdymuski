<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080c1c"><meta name="description" content="An interactive cinematic birthday surprise. Make a wish.">
<title>Make a Wish</title>
<style>
:root{color-scheme:dark;--gold:#d6b26b;--ivory:#f6edd9;--muted:#9ba7bf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c1c;font-family:Georgia,"Times New Roman",serif;color:var(--ivory)}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#172545 0,#0b1429 45%,#050812 100%)}
#stage{position:relative;width:min(100vw,66.6667vh);height:min(100vh,150vw);aspect-ratio:2/3;overflow:hidden;background:#080c1c;box-shadow:0 0 90px #000b}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;bottom:max(13px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:10px/1.4 system-ui,sans-serif;letter-spacing:.13em;color:#8e9ab0a8;pointer-events:none}
#touch{position:absolute;inset:auto 0 42px;display:flex;justify-content:center;gap:12px;pointer-events:none}
.ctrl{pointer-events:auto;border:1px solid #d6b26b66;border-radius:999px;background:#111b31bb;color:#f6edd9;padding:13px 20px;font:11px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-tap-highlight-color:transparent}
.ctrl:active{background:#d6b26b33}
#hold{display:none;min-width:190px}#hold.visible{display:block}
@media(hover:hover) and (pointer:fine){#touch{display:none}}
</style>
</head>
<body><main id="stage" aria-label="Make a Wish birthday animation"><canvas id="scene" width="800" height="1200"></canvas><div id="touch"><button class="ctrl" id="begin">Begin</button><button class="ctrl" id="hold">Hold to make a wish</button><button class="ctrl" id="replay">Replay</button></div><div class="hint">R RESTART&nbsp;&nbsp; · &nbsp;&nbsp;F FULLSCREEN&nbsp;&nbsp; · &nbsp;&nbsp;ESC QUIT</div></main>
<script>
(()=>{'use strict';
const W=800,H=1200,canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');
const GOLD='#d6b26b',IVORY='#f6edd9',CHAMP='#ecd08c',NAVY='#1c2a48',MID='#080c1c';
const colors=['#ffdc78','#fffefa','#ffb4c8','#a0c8ff','#ffb450','#f0dca0'];
const S={TITLE:0,RISE:1,LIT:2,COUNT:3,WISH:4,MADE:5,CELEBRATE:6};
let state=S.TITLE,t=0,globalT=0,last=0,progress=0,holdTime=0,lightIdx=0,count=3,particles=[],confetti=[],fireworks=[],stars=[],dust=[],candles=[];
let wishing=false,raf=0,fullscreen=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,p)=>a+(b-a)*p;
const smooth=x=>(x=clamp(x,0,1),x*x*(3-2*x)),out=x=>1-Math.pow(1-clamp(x,0,1),3);
function reset(){state=S.TITLE;t=0;progress=0;holdTime=0;lightIdx=0;count=3;particles=[];confetti=[];fireworks=[];candles=[];for(const x of [-38,0,38])candles.push({x,y:-95,lit:false,phase:rand(0,6.28),flame:0,glow:0});for(const x of [-70,-35,0,35,70])candles.push({x,y:-15,lit:false,phase:rand(0,6.28),flame:0,glow:0});}
for(let i=0;i<170;i++)stars.push({x:rand(0,W),y:rand(0,H),b:rand(.3,1),s:rand(.5,2.5),r:rand(.5,1.5)});
for(let i=0;i<65;i++)dust.push({x:rand(0,W),y:rand(0,H),a:rand(.2,.7),s:rand(8,25)});
reset();
function text(str,size,y,color=IVORY,alpha=1,italic=false,spacing=0){ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(italic?'italic ':'')+size+'px Georgia,serif';ctx.fillStyle='#0008';ctx.fillText(str,W/2+2,y+3);ctx.fillStyle=color;if(spacing){let chars=[...str],width=chars.reduce((v,c)=>v+ctx.measureText(c).width,0)+spacing*(chars.length-1),x=(W-width)/2;for(const c of chars){ctx.fillText(c,x+ctx.measureText(c).width/2,y);x+=ctx.measureText(c).width+spacing;}}else ctx.fillText(str,W/2,y);ctx.restore();}
function glow(x,y,r,color,alpha){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color.replace(')',','+alpha+')').replace('rgb(','rgba('));g.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}
function background(intensity=1){let g=ctx.createRadialGradient(400,650,30,400,650,850);g.addColorStop(0,'#1c3155');g.addColorStop(.48,'#101d36');g.addColorStop(1,MID);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){let a=s.b*(.5+.5*Math.sin(globalT*s.s+s.x*.01))*intensity;ctx.globalAlpha=a;ctx.fillStyle='#dce8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();}ctx.globalAlpha=1;
for(const d of dust){let y=(d.y+globalT*d.s*3)%(H+30);ctx.globalAlpha=d.a*.22*intensity;ctx.fillStyle='#dce8ff';ctx.beginPath();ctx.arc(d.x,y,1.2,0,6.28);ctx.fill();}ctx.globalAlpha=1;}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function cake(){const cx=400,cy=640;
glow(cx,cy+40,300,'rgb(255,205,130)',.12);
ctx.save();ctx.translate(cx,cy);
ctx.fillStyle='#9b8757';ctx.beginPath();ctx.ellipse(0,126,164,17,0,0,6.28);ctx.fill();ctx.fillStyle='#d6c18a';ctx.beginPath();ctx.ellipse(0,120,153,15,0,0,6.28);ctx.fill();
let b=ctx.createLinearGradient(-140,0,140,0);b.addColorStop(0,'#b6a88c');b.addColorStop(.25,'#fff9e9');b.addColorStop(.7,'#e9ddc7');b.addColorStop(1,'#a99a80');rounded(-130,-1,260,121,8,b);
ctx.fillStyle=NAVY;ctx.fillRect(-130,54,260,18);for(let i=0;i<18;i++){ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(-120+i*14,63,2.2,0,6.28);ctx.fill();}
for(let i=0;i<13;i++){let x=-125+i*20;ctx.fillStyle=CHAMP;ctx.beginPath();ctx.ellipse(x,-4,12,9,0,0,6.28);ctx.fill();ctx.fillStyle=IVORY;ctx.beginPath();ctx.ellipse(x,-7,9,7,0,0,6.28);ctx.fill();}
let top=ctx.createLinearGradient(-90,0,90,0);top.addColorStop(0,'#b9aa8e');top.addColorStop(.3,'#fff9ec');top.addColorStop(.75,'#e9ddc9');top.addColorStop(1,'#b0a087');rounded(-85,-82,170,83,8,top);
for(let i=0;i<9;i++){let x=-80+i*20;ctx.fillStyle=CHAMP;ctx.beginPath();ctx.ellipse(x,-84,11,8,0,0,6.28);ctx.fill();ctx.fillStyle=IVORY;ctx.beginPath();ctx.ellipse(x,-87,8,6,0,0,6.28);ctx.fill();}
for(let i=0;i<candles.length;i++){let c=candles[i],tier=i<3?0:1,baseY=tier===0?-82:0,bottom=baseY+c.y+0;let x=c.x;let y=bottom-38;
ctx.fillStyle='#f4e6c6';ctx.fillRect(x-5,y,10,38);for(let k=0;k<7;k++){ctx.fillStyle=k%2?'#f6edd9':GOLD;ctx.fillRect(x-5,y+k*5,10,2.7);}
if(c.flame>.8){let fy=y-5,h=c.flame,fl=Math.sin(c.phase)*2+Math.sin(c.phase*2.3);
glow(x,fy-h*.35,32,'rgb(255,177,65)',.18*c.glow);
ctx.fillStyle='#ffb84f';ctx.beginPath();ctx.moveTo(x,fy-h-2+fl);ctx.quadraticCurveTo(x-13,fy-h*.35,x,fy);ctx.quadraticCurveTo(x+13,fy-h*.35,x,fy-h-2+fl);ctx.fill();
ctx.fillStyle='#fff5ce';ctx.beginPath();ctx.moveTo(x,fy-h*.78);ctx.quadraticCurveTo(x-4,fy-h*.25,x,fy);ctx.quadraticCurveTo(x+4,fy-h*.25,x,fy-h*.78);ctx.fill();}
}
ctx.restore();}
function particle(x,y,vx,vy,life,size,color,gravity=90){particles.push({x,y,vx,vy,life,max:life,size,color,gravity});}
function burst(x,y){let base=colors[Math.floor(rand(0,colors.length))];for(let i=0,n=rand(36,58);i<n;i++){let a=rand(0,6.28),v=rand(75,270);particle(x,y,Math.cos(a)*v,Math.sin(a)*v,rand(.7,1.6),rand(1.5,3.5),Math.random()<.4?'#fff':base,90);}}
function firework(){let x=rand(80,720),y=rand(80,520);burst(x,y);}
function update(dt){globalT+=dt;t+=dt;
particles=particles.filter(p=>(p.vy+=p.gravity*dt,p.x+=p.vx*dt,p.y+=p.vy*dt,p.life-=dt,p.life>0));
confetti=confetti.filter(p=>(p.vy+=60*dt,p.x+=p.vx*dt,p.y+=p.vy*dt,p.rot+=p.vrot*dt,p.life-=dt,p.life>0&&p.y<H+50));
for(const f of fireworks){f.life-=dt;}fireworks=fireworks.filter(f=>f.life>0);
if(state===S.TITLE){}
else if(state===S.RISE){let p=out(t/2.8);cakeY=lerp(220,0,p);if(t>3.6){state=S.LIT;t=0;lightIdx=0;}}
else if(state===S.LIT){while(lightIdx<candles.length&&t>lightIdx*.38){candles[lightIdx].lit=true;lightIdx++;}if(t>candles.length*.38+1.8){state=S.COUNT;t=0;count=3;}}
else if(state===S.COUNT){count=3-Math.floor(t);if(t>3.2){state=S.WISH;t=0;progress=0;}}
else if(state===S.WISH){if(wishing){holdTime+=dt;progress=Math.min(1,progress+dt*.55);}else progress=Math.max(0,progress-dt*.35);if(progress>=1){candles.forEach(c=>{if(c.lit)for(let j=0;j<7;j++)particle(400+c.x+rand(-6,6),640+c.y-70,rand(-20,20),rand(-55,-15),rand(1,2),rand(3,7),'#b4b8c5',-25);c.lit=false;});state=S.MADE;t=0;wishing=false;}}
else if(state===S.MADE&&t>3.2){state=S.CELEBRATE;t=0;}
else if(state===S.CELEBRATE){if(Math.random()<.10)confetti.push({x:rand(0,W),y:-20,vx:rand(-45,45),vy:rand(40,140),rot:rand(0,6.28),vrot:rand(-3,3),w:rand(5,13),h:rand(4,9),color:colors[Math.floor(rand(0,colors.length))],life:rand(4,7)});if(Math.random()<.025&&fireworks.length<5){fireworks.push({life:1});firework();}}
candles.forEach(c=>{c.phase+=dt*9;let target=c.lit?18+progress*14:0;c.flame+=(target-c.flame)*(1-Math.exp(-8*dt));c.glow+=( (c.lit?1+progress*.8:0)-c.glow)*(1-Math.exp(-6*dt));});
}
let cakeY=220;
function draw(){let intensity=state===S.WISH?1-progress*.38:state===S.MADE?.55:state===S.CELEBRATE?.85:1;background(intensity);
if(state>=S.MADE)glow(400,650,280,'rgb(255,190,210)',state===S.MADE?Math.min(.28,t*.12):.24);
if(state>=S.RISE){ctx.save();ctx.translate(0,cakeY);cake();ctx.restore();}
for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.7,p.size*p.life/p.max),0,6.28);ctx.fill();}ctx.globalAlpha=1;
for(const p of confetti){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
if(state===S.TITLE){text('MAKE A WISH',67,390,GOLD,1,false,9);text('an interactive birthday surprise',27,470,CHAMP,.9,true);let blink=.55+.45*Math.sin(globalT*2.8);text('Press ENTER to begin',22,755,IVORY,blink,false);}
if(state===S.RISE)text('Someone special is celebrating today...',22,180,CHAMP,smooth((t-1.2)/1.2));
if(state===S.LIT){text('Before we celebrate...',23,160,CHAMP);text('Close your eyes and make a wish.',27,205,IVORY,smooth((t-1)/1.2),true);}
if(state===S.COUNT){text(String(Math.max(1,count)),94,280,GOLD,1,false,2);}
if(state===S.WISH){text('Press and hold to make your wish',22,180);rounded(250,218,300,5,3,'#444b60');rounded(250,218,300*progress,5,3,GOLD);glow(250+300*progress,220,22,'rgb(214,178,107)',.35);}
if(state===S.MADE){text('WISH MADE.',65,280,GOLD,smooth(t/.8),false,7);text('Now let the beautiful things begin.',27,365,CHAMP,smooth(t/.8),true);}
if(state===S.CELEBRATE){text('HAPPY BIRTHDAY!',55,240,GOLD,1,false,4);text('May every little wish find its way to you.',25,320,CHAMP,1,true);text('Press R to replay',17,1100,IVORY,.55+.4*Math.sin(globalT*2.2));}
ctx.globalAlpha=1;
}
function frame(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();raf=requestAnimationFrame(frame);}
function begin(){if(state===S.TITLE){state=S.RISE;t=0;cakeY=220;}else if(state===S.CELEBRATE)reset();}
function holdStart(e){if(e)e.preventDefault();if(state===S.WISH)wishing=true;}
function holdEnd(e){if(e)e.preventDefault();wishing=false;}
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Enter')begin();if(e.code==='Space')holdStart(e);if(e.code==='KeyR')reset();if(e.code==='KeyF'){fullscreen=!fullscreen;if(fullscreen&&stage.requestFullscreen)stage.requestFullscreen().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen?.();}if(e.code==='Escape'){if(document.fullscreenElement)document.exitFullscreen?.();else reset();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')holdEnd(e);});
document.querySelector('#begin').addEventListener('click',begin);document.querySelector('#replay').addEventListener('click',reset);
const hb=document.querySelector('#hold');hb.addEventListener('pointerdown',holdStart);['pointerup','pointercancel','pointerleave'].forEach(ev=>hb.addEventListener(ev,holdEnd));
canvas.addEventListener('pointerdown',e=>{if(state===S.TITLE)begin();else if(state===S.WISH){wishing=true;canvas.setPointerCapture?.(e.pointerId);}});
canvas.addEventListener('pointerup',()=>wishing=false);canvas.addEventListener('pointercancel',()=>wishing=false);
const observer=new MutationObserver(()=>{document.querySelector('#begin').style.display=state===S.TITLE?'block':'none';hb.classList.toggle('visible',state===S.WISH);document.querySelector('#replay').style.display=state===S.CELEBRATE?'block':'none';});
observer.observe(document.querySelector('#touch'),{attributes:true,subtree:true,attributeFilter:['class']});
setInterval(()=>{document.querySelector('#begin').style.display=state===S.TITLE?'block':'none';hb.classList.toggle('visible',state===S.WISH);document.querySelector('#replay').style.display=state===S.CELEBRATE?'block':'none';},150);
requestAnimationFrame(frame);
})();
</script></body></html>
